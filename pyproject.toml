[project]
name = "landoc"
version = "0.2.25"
description = "局域网个人资料库共享：加密/明文办公文档转 Markdown、FTS5 索引、只读检索服务"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-docx",
    "python-pptx",
    "pymupdf",
    "pywin32",
    "pystray",
    "Pillow",
    # netinfo 用它挑「本机所在网段」当默认允许网段；以前没声明，只因开发机上碰巧装着，
    # 干净环境里 pip install landoc 后启动会直接 ImportError（3.8）。
    "psutil",
]

[project.optional-dependencies]
# 打包用：只有出安装包的那台机器需要
build = ["pyinstaller>=6.0"]
# 开发用：跑测试才需要，装到同事机器上会白占几十 MB
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["landoc"]

[tool.setuptools.package-data]
# 检索页是纯静态文件，装成 wheel 时别漏（PyInstaller 打包同样要 --add-data）；
# tools/ 是扫描件 OCR 的桥脚本与 Tesseract 最小集
landoc = [
    "web/*.html",
    "tools/*.ps1",
    "tools/tesseract/*",
    "tools/tessdata/*.traineddata",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要真机 Office、真实加密文档或大文件的集成测试（LANSHARE_IT=1 时运行）",
]
